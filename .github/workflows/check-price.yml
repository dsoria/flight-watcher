name: Check flight price

on:
  schedule:
    # CDMX / UTC:
    # 00:30 CDMX = 05:30 UTC
    # 08:00 CDMX = 13:00 UTC
    # 20:00 CDMX = 01:00 UTC del día siguiente
    - cron: "30 5 * * *"
    - cron: "0 13 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # permite correrlo manualmente desde la pestaña "Actions"

permissions:
  contents: write   # necesario para poder guardar state.json de vuelta al repo

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Consultar precio y notificar si aplica
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python flight_watch.py

      - name: Guardar el estado (state.json) de vuelta al repo
        run: |
          git config user.name "flight-watcher-bot"
          git config user.email "actions@github.com"
          git add state.json

          if git diff --cached --quiet; then
            echo "No hay cambios en state.json; se omite el push."
            exit 0
          fi

          git commit -m "Actualiza estado de precios [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin HEAD:"${GITHUB_REF_NAME:-main}"
