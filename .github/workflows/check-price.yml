name: Check flight price

on:
  schedule:
    # Corre a las 13:00 y 23:00 UTC todos los días.
    # Ajusta estas horas a tu gusto: https://crontab.guru
    - cron: "0 13 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # permite correrlo manualmente desde la pestaña "Actions"

permissions:
  contents: write   # necesario para poder guardar state.json de vuelta al repo

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Consultar precio y notificar si aplica
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python flight_watch.py

      - name: Guardar el estado (state.json) de vuelta al repo
        run: |
          git config user.name "flight-watcher-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Actualiza estado de precios [skip ci]"
          git push
